<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
<style>
    .grid-box{
        border:  solid #000;
        background-color: blanchedalmond;
    }
</style>
    <!-- Row 1: Twelve columns of 1 unit -->
    <div class="row mb-3 g-0 row-1-text">
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
        <div class="col-md-1 grid-box">.col-md-1</div>
    </div>

    <!-- Row 2: One column of 8 units and one of 4 units -->
    <div class="row mb-3 g-0">
        <div class="col-md-8 grid-box">.col-md-8</div>
        <div class="col-md-4 grid-box">.col-md-4</div>
    </div>

    <!-- Row 3: Three columns of 4 units -->
    <div class="row mb-3 g-0">
        <div class="col-md-4 grid-box">.col-md-4</div>
        <div class="col-md-4 grid-box">.col-md-4</div>
        <div class="col-md-4 grid-box">.col-md-4</div>
    </div>

    <!-- Row 4: Two columns of 6 units -->
    <div class="row mb-3 g-0">
        <div class="col-md-6 grid-box">.col-md-6</div>
        <div class="col-md-6 grid-box">.col-md-6</div>
    </div>

</div>
</body>
</html>
